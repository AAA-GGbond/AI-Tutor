<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>学迹 · 学生学习档案</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#192c32;background:#f3f6f5;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:11px 16px;background:#126a59;color:white}button:disabled{opacity:.5;cursor:wait}button.secondary{background:#e9f0ed;color:#255248}input,select,textarea{width:100%;border:1px solid #d8e1dc;border-radius:8px;background:white;padding:11px;color:#192c32}textarea{resize:vertical;line-height:1.6}label{display:block;margin:15px 0 6px;color:#52645e}h1,h2,h3,p{margin-top:0}h1{font-size:28px;font-weight:650;letter-spacing:-1px}h2{font-size:19px}h3{font-size:15px}.muted{color:#75837d;line-height:1.8}.shell{display:grid;grid-template-columns:245px 1fr;min-height:100vh}aside{background:#fff;border-right:1px solid #e0e7e2;padding:30px 20px}.brand{font-size:25px;font-weight:750;color:#126a59;margin-bottom:6px}.brand small{font-size:11px;letter-spacing:3px;color:#81908a;display:block;margin-top:8px}.sidehead{display:flex;justify-content:space-between;align-items:center;margin:35px 0 14px;color:#79877f}.student{width:100%;text-align:left;color:#53645c;background:transparent;margin-bottom:7px;padding:14px}.student.active{background:#e6f2eb;color:#126a59}.student small{display:block;margin-top:5px;color:#809187}main{padding:40px;max-width:1420px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:28px}.pill{display:inline-block;padding:5px 10px;border-radius:20px;background:#e6f2eb;color:#126a59;font-size:12px}.pill.warn{background:#fff0dc;color:#9a651b}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:24px}.card{background:#fff;border:1px solid #e0e8e2;border-radius:16px;padding:24px}.stat .num{font-size:32px;margin:12px 0 3px;font-weight:650}.grid{display:grid;grid-template-columns:1.35fr 1fr;gap:24px}.sectiontitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.weak{padding:18px 0;border-top:1px solid #edf0ee}.weak:first-child{border-top:0}.weakhead{display:flex;justify-content:space-between;margin-bottom:11px}.track{height:5px;background:#edf2ee;border-radius:10px}.fill{height:5px;background:#dba45b;border-radius:10px}.evidence{margin-top:13px;padding:12px;background:#f6f8f5;border-radius:8px;font-size:12px;line-height:1.8}.drop{border:1px dashed #a7c3b5;background:#f7fbf8;padding:23px;text-align:center;border-radius:12px;margin-top:18px}.drop input{margin-top:12px;padding:8px;font-size:12px}.previews{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.previews img{width:65px;height:80px;object-fit:cover;border-radius:6px;border:1px solid #ddd}.full{width:100%;margin-top:18px}.history{margin-top:24px}.paper{padding:18px 0;border-top:1px solid #edf0ee}.paper summary{cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px}.result{background:#f7f9f7;border-radius:10px;padding:16px;margin-top:14px;line-height:1.8}.question{border-top:1px solid #e2e7e3;margin-top:12px;padding-top:12px}.empty{text-align:center;padding:35px 15px;color:#859188;line-height:1.9}.notice{padding:12px 15px;background:#fff6e8;color:#96703a;line-height:1.7;border-radius:9px;font-size:12px;margin-bottom:20px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#223b31;color:white;padding:14px 22px;border-radius:10px;max-width:90%;z-index:10}.hidden{display:none!important}dialog{border:0;border-radius:18px;max-width:720px;width:90%;padding:30px;box-shadow:0 20px 80px #0002}dialog::backdrop{background:#172b2466}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.loading{color:#126a59;line-height:1.8;margin-top:12px}@media(max-width:900px){.shell{grid-template-columns:190px 1fr}main{padding:25px}.grid{grid-template-columns:1fr}}@media(max-width:600px){.shell{display:block}aside{padding:20px}.brand small{display:none}.sidehead{margin:15px 0}.student{width:auto;margin-right:5px}#studentList{display:flex;overflow:auto}.student small{white-space:nowrap}.top{align-items:flex-start}main{padding:20px}.stats{gap:8px}.card{padding:18px}.stat .num{font-size:26px}h1{font-size:23px}}
</style>
<style>
main{margin:0 auto;max-width:1180px}.nav{display:grid;gap:7px;margin-top:32px}.nav a{padding:13px 15px;border-radius:9px;color:#63756b;text-decoration:none}.nav a.active{background:#e6f2eb;color:#126a59;font-weight:600}.sidehead{margin-top:30px}.statusbar{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;border-bottom:1px solid #dfe7e1;padding-bottom:18px;margin-bottom:30px;font-size:12px;color:#748279}.statusbar strong{color:#254a3d;font-size:14px}.top{margin-bottom:24px}.top h1{margin-bottom:10px}.page{max-width:880px}.page.hidden{display:none}.stats{gap:12px}.stat{padding:18px}.stat .num{font-size:25px}.history{margin-top:0}.upload-page{max-width:660px}.settings-page{max-width:780px}.statusbar .pill{margin-left:auto}.weak .evidence{display:none}.weak details .evidence{display:block}.page-description{margin-bottom:24px}.modehint{font-size:12px;margin:10px 0 0;color:#96703a;line-height:1.7}@media(max-width:600px){.nav{display:flex;overflow:auto;margin-top:18px;gap:4px}.nav a{white-space:nowrap;padding:10px}.statusbar{gap:8px 12px;margin-bottom:24px}.statusbar .pill{margin-left:0}.stat{padding:12px}.stat .num{font-size:24px}.stat>span:last-child{display:none}.sectiontitle{gap:10px}.sidehead{margin-top:20px}}
</style>
<div class="shell"><aside><div class="brand">学迹<span style="font-size:12px;margin-left:8px;font-weight:400">Demo</span><small>LEARNING JOURNAL</small></div><nav class="nav" aria-label="功能导航"><a href="#profile" data-page="profile">学习档案</a><a href="#upload" data-page="upload">上传试卷</a><a href="#history" data-page="history">分析记录</a></nav><div class="sidehead"><span>我的学生</span><button class="secondary" id="newStudent">＋ 新建</button></div><div id="studentList"></div></aside><main>
<div class="statusbar" aria-live="polite"><strong id="currentStudent">尚未选择学生</strong><span id="currentStage">—</span><span id="currentVersion">档案 v0 · 0 份试卷</span><span id="taskStatus">暂无进行中的分析</span><span class="pill warn" id="connectionStatus">模型未配置</span></div>
<div class="top"><div><h1 id="heading">学习档案</h1><span class="muted" id="subtitle">查看累计薄弱项与学习证据。</span></div></div>
<section class="page" data-panel="profile">
<div class="stats"><div class="card stat"><span class="muted">已分析试卷</span><div class="num" id="paperCount">0</div><span class="muted">持续积累学习证据</span></div><div class="card stat"><span class="muted">待巩固知识点</span><div class="num" id="weakCount">0</div><span class="muted">每个结论都有来源</span></div><div class="card stat"><span class="muted">档案版本</span><div class="num" id="version">0</div><span class="muted">每张试卷更新一次</span></div></div>
<section class="card"><div class="sectiontitle"><h2 style="margin:0">学习薄弱项</h2><a href="#upload" style="color:#126a59;text-decoration:none">上传新试卷 →</a></div><div id="weaknesses"></div></section></section>
<section class="page upload-page hidden" data-panel="upload"><section class="card"><form id="uploadForm"><label for="paperTitle" style="margin-top:0">试卷名称</label><input id="paperTitle" placeholder="例如：有理数单元测试" maxlength="120" required><p class="modehint hidden" id="modeHint">当前为模拟体验，上传图片不会被识别，结果仅用于展示流程。</p><div class="drop">上传试卷图片<br><span class="muted" style="font-size:12px">JPG / PNG / WebP · 最多 6 页 · 总计 15MB</span><input id="files" aria-label="试卷图片" type="file" accept="image/jpeg,image/png,image/webp" multiple required></div><div class="previews" id="previews"></div><label for="notes">补充说明（可选）</label><textarea id="notes" rows="2" placeholder="例如：红笔标记为老师批改，第二页第3题未作答。"></textarea><button class="full" id="analyzeButton">分析并更新档案 →</button><div id="progress" class="loading hidden">正在分析试卷，请稍候。你可以切换页面查看其他信息。</div></form></section></section>
<section class="page hidden" data-panel="history">
<section class="card history"><div class="sectiontitle"><h2 style="margin:0">试卷与分析记录</h2><span class="muted">点击展开本次结果</span></div><div id="history"></div></section>
</section>
</main></div>
<dialog id="studentDialog"><h2>新建学生档案</h2><form id="studentForm"><label>学生姓名</label><input id="studentName" placeholder="输入姓名或昵称" maxlength="80" required><label>学习阶段</label><select id="stage"></select><div class="actions"><button type="button" class="secondary" id="cancelStudent">取消</button><button>创建档案</button></div></form></dialog>
<div class="toast hidden" id="toast" role="status"></div>
<script>
let state,selected,busy=false,previewUrls=[],taskMessage='暂无进行中的分析';
const pages={profile:['学习档案','查看累计薄弱项，展开证据了解具体错误。'],upload:['上传试卷','同一份试卷的各页一起上传，分析后更新当前学生档案。'],history:['分析记录','回看每份试卷的逐题结果与分析结论。']};
const $=id=>document.getElementById(id);
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(message){$('toast').textContent=message;$('toast').classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),6000)}
async function api(path,body){const response=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const data=await response.json();if(!response.ok)throw Error(data.error||'操作失败');return data}
async function refresh(){state=await api('/api/state');if(!state.students.some(s=>s.id===selected))selected=state.students[0]?.id;render()}
function showPage(){let page=location.hash.slice(1);if(!pages[page])page='profile';document.querySelectorAll('[data-panel]').forEach(p=>p.classList.toggle('hidden',p.dataset.panel!==page));document.querySelectorAll('[data-page]').forEach(a=>{a.classList.toggle('active',a.dataset.page===page);if(a.dataset.page===page)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});$('heading').textContent=pages[page][0];$('subtitle').textContent=pages[page][1];document.title=pages[page][0]+' · 学迹'}
window.addEventListener('hashchange',showPage);showPage();
function render(){
 $('studentList').innerHTML=state.students.length?state.students.map(s=>`<button class="student ${s.id===selected?'active':''}" data-student="${s.id}">${escape(s.name)}<small>${escape(s.stage)}</small></button>`).join(''):'<p class="muted">还没有学生，点击新建开始。</p>';
 document.querySelectorAll('[data-student]').forEach(b=>b.onclick=()=>{if(busy)return;selected=b.dataset.student;render()});
 const student=state.students.find(s=>s.id===selected);const weaknesses=Object.values(student?.profile.weaknesses||{}).sort((a,b)=>b.severity-a.severity);
 $('currentStudent').textContent=student?student.name:'尚未选择学生';$('currentStage').textContent=student?student.stage+' · 数学':'先新建一位学生';$('currentVersion').textContent=`档案 v${student?.version||0} · ${student?.profile.paper_count||0} 份试卷`;$('taskStatus').textContent=busy?'正在分析「'+$('paperTitle').value+'」':taskMessage;$('connectionStatus').textContent=state.service_mode==='demo'?'模拟体验':'学习分析服务';$('connectionStatus').classList.toggle('warn',state.service_mode==='demo');$('modeHint').classList.toggle('hidden',state.service_mode!=='demo');$('newStudent').disabled=busy;document.querySelectorAll('[data-student]').forEach(b=>b.disabled=busy);
 $('paperCount').textContent=student?.profile.paper_count||0;$('weakCount').textContent=weaknesses.length;$('version').textContent=student?.version||0;$('analyzeButton').disabled=!student||busy;
 $('weaknesses').innerHTML=weaknesses.length?weaknesses.map(w=>`<div class="weak"><div class="weakhead"><strong>${escape(w.name)}</strong><span class="pill warn">${w.severity}/5 · ${w.evidence.length} 条证据</span></div><div class="track"><div class="fill" style="width:${w.severity*20}%"></div></div>${w.evidence.slice(-2).reverse().map(e=>`<div class="evidence"><strong>${escape(e.title)} · 第 ${escape(e.number)} 题</strong><br>${escape(e.reason)}<br><span class="muted">建议：${escape(e.suggestion)}</span></div>`).join('')}<details style="margin-top:10px"><summary class="muted">查看全部证据</summary>${w.evidence.map(e=>`<p class="muted" style="font-size:12px;margin:10px 0">${escape(e.date.slice(0,10))} · ${escape(e.title)} · 第 ${escape(e.number)} 题<br>${escape(e.error_type)}：${escape(e.reason)}</p>`).join('')}</details></div>`).join(''):'<div class="empty">学习档案等待第一份证据<br>上传试卷后，薄弱知识点会显示在这里。</div>';
 const papers=state.papers.filter(p=>p.student_id===selected);
 $('history').innerHTML=papers.length?papers.map(p=>`<details class="paper"><summary><div><strong>${escape(p.title)}</strong><div class="muted" style="font-size:12px;margin-top:6px">${escape(new Date(p.created_at).toLocaleString('zh-CN'))} · ${p.analysis.questions.length} 道已分析题目</div></div><span class="pill ${p.mode==='demo'?'warn':''}">${p.mode==='demo'?'模拟分析':'真实分析'}</span></summary><div class="result">${escape(p.analysis.summary)}${p.analysis.questions.map(q=>`<div class="question"><strong>第 ${escape(q.number)} 题 · ${{correct:'正确',incorrect:'错误',uncertain:'待确认'}[q.status]}</strong> <span class="muted">置信度 ${Math.round(q.confidence*100)}%</span><br>${escape(q.reason)}<br><span class="muted">${escape(q.suggestion)}</span>${q.status==='incorrect'&&q.confidence<.75?'<br><span class="pill warn">低置信度，未计入薄弱项</span>':''}</div>`).join('')}</div></details>`).join(''):'<div class="empty">还没有分析记录</div>';
 const pending=(state.pending||[]).filter(j=>j.student_id===selected);if(pending.length){$('taskStatus').textContent=busy?$('taskStatus').textContent:pending.length+' 份试卷等待处理';$('history').insertAdjacentHTML('afterbegin',pending.map(j=>`<div class="paper"><strong>${escape(j.title)}</strong> <span class="pill">等待处理</span><p class="muted">已收到试卷，分析完成后结果会显示在这里。</p></div>`).join(''))}
}
$('newStudent').onclick=()=>{$('stage').innerHTML=state.stages.map(s=>`<option>${escape(s)}</option>`).join('');$('studentDialog').showModal()};
$('cancelStudent').onclick=()=>$('studentDialog').close();
$('studentForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/students',{name:$('studentName').value,stage:$('stage').value});$('studentDialog').close();$('studentForm').reset();selected=null;await refresh();toast('学生档案已创建')}catch(error){toast(error.message)}};
$('files').onchange=()=>{previewUrls.forEach(u=>URL.revokeObjectURL(u));previewUrls=[...$('files').files].map(f=>URL.createObjectURL(f));$('previews').innerHTML=previewUrls.map(u=>`<img src="${u}" alt="试卷预览">`).join('')};
function dataURL(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)})}
$('uploadForm').onsubmit=async e=>{e.preventDefault();if(busy||!selected)return;const files=[...$('files').files];if(files.length>6||files.reduce((n,f)=>n+f.size,0)>15*1024*1024){toast('最多 6 张图片，总计不能超过 15MB');return}busy=true;const studentId=selected;render();$('uploadForm').querySelectorAll('input,select,textarea').forEach(el=>el.disabled=true);$('progress').classList.remove('hidden');try{const images=await Promise.all(files.map(async f=>({name:f.name,data:await dataURL(f)})));const submission=await api('/api/analyze',{student_id:studentId,title:$('paperTitle').value,notes:$('notes').value,files:images});taskMessage=submission.pending?'试卷已提交 · 等待处理':'分析完成 · 档案已更新';$('uploadForm').reset();previewUrls.forEach(u=>URL.revokeObjectURL(u));previewUrls=[];$('previews').innerHTML='';await refresh();location.hash='history';toast(submission.pending?'试卷已提交，完成后可在分析记录查看':'试卷已分析，学习档案已更新')}catch(error){taskMessage='本次处理未完成 · 请重试';toast(error.message)}finally{busy=false;$('uploadForm').querySelectorAll('input,select,textarea').forEach(el=>el.disabled=false);$('progress').classList.add('hidden');render()}};
refresh().catch(error=>toast(error.message));
setInterval(()=>{if(!busy&&(state?.pending||[]).length)refresh().catch(()=>{})},15000);
</script>
</html>
